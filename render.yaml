# Create a Blueprint from this repository, or use the same settings manually.
# Supply an existing cloud PostgreSQL database with the application schema/data.
services:
  - type: web
    name: damh-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.19.0
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: DEMO_FLIGHTS_ENABLED
        value: "false"
      - key: DEMO_PAYMENTS_ENABLED
        value: "false"
